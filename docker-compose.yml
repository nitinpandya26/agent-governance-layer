services:
  postgres:
    image: postgres:16
    container_name: governance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: governance_dev_pw
      POSTGRES_DB: governance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./audit/init.sql:/docker-entrypoint-initdb.d/init.sql

  opa:
    image: openpolicyagent/opa:1.20.2
    container_name: governance-opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./policies:/policies:ro
    restart: unless-stopped

volumes:
  pgdata: