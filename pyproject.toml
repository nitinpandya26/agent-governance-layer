[project]
name = "agent-governance-layer"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Nitin Pandya", email = "nitinpandya26@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "openai>=3.16.2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
